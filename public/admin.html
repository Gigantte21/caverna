<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Caverna · Admin</title>
<style>
:root {
  --black: #0a0806; --deep: #110d0a; --card: #1a1410;
  --wine: #6b1a2a; --wine-lt: #8b2a3f;
  --gold: #c9a84c; --gold-lt: #e2c97e; --gold-dk: #8a6b28;
  --cream: #f0e6d3; --muted: #8a7a6a; --text: #e8ddd0;
  --green: #4caf7d; --red: #e05555;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--black); color: var(--text); font-family: 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

/* LOGIN */
#login-screen { position: fixed; inset: 0; z-index: 999; background: var(--black); display: flex; align-items: center; justify-content: center; }
.login-box { background: var(--deep); border: 1px solid rgba(201,168,76,.2); border-radius: 12px; padding: 2rem; width: 320px; text-align: center; }
.login-box h2 { font-size: 1rem; letter-spacing: .2em; color: var(--gold); margin-bottom: 1.5rem; text-transform: uppercase; }
.login-box input { width: 100%; background: var(--card); border: 1px solid rgba(201,168,76,.2); border-radius: 6px; padding: .75rem 1rem; color: var(--cream); font-size: .875rem; outline: none; margin-bottom: 1rem; }
.login-box button { width: 100%; padding: .75rem; background: linear-gradient(135deg, var(--wine), var(--wine-lt)); border: none; border-radius: 6px; color: var(--cream); font-size: .875rem; cursor: pointer; }
.login-box .erro { color: var(--red); font-size: .75rem; margin-top: .5rem; }

/* HEADER */
.header { background: var(--deep); border-bottom: 1px solid rgba(201,168,76,.15); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 1rem; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
.header .sair { background: none; border: 1px solid rgba(201,168,76,.2); color: var(--muted); border-radius: 4px; padding: .3rem .75rem; cursor: pointer; font-size: .75rem; }

/* LAYOUT */
.layout { display: grid; grid-template-columns: 340px 1fr; gap: 0; min-height: calc(100vh - 57px); }
.sidebar { background: var(--deep); border-right: 1px solid rgba(201,168,76,.1); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.section-title { font-size: .6rem; letter-spacing: .25em; color: var(--gold-dk); text-transform: uppercase; margin-bottom: .5rem; }
.form-group { margin-bottom: .75rem; }
.form-group label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: .3rem; }
.form-group input, .form-group select { width: 100%; background: var(--card); border: 1px solid rgba(201,168,76,.15); border-radius: 6px; padding: .5rem .75rem; color: var(--cream); font-size: .8rem; outline: none; }
.form-group input:focus { border-color: var(--gold-dk); }
.btn { width: 100%; padding: .65rem; border: none; border-radius: 6px; cursor: pointer; font-size: .8rem; font-weight: 600; transition: opacity .2s; }
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--wine), var(--wine-lt)); color: var(--cream); }
.btn-secondary { background: var(--card); color: var(--gold); border: 1px solid rgba(201,168,76,.2); }
.btn-danger { background: rgba(224,85,85,.15); color: var(--red); border: 1px solid rgba(224,85,85,.2); }
.divider { height: 1px; background: rgba(201,168,76,.08); margin: .5rem 0; }
.main { padding: 1.5rem; overflow-y: auto; }

/* TOAST */
.toast { position: fixed; top: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: .5rem; }
.toast-item { background: var(--card); border: 1px solid rgba(201,168,76,.2); border-radius: 8px; padding: .75rem 1rem; font-size: .8rem; max-width: 320px; animation: slideIn .3s ease; }
.toast-item.ok { border-color: rgba(76,175,125,.4); color: var(--green); }
.toast-item.err { border-color: rgba(224,85,85,.4); color: var(--red); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* LINK BOX */
.link-box { background: var(--card); border: 1px solid rgba(201,168,76,.2); border-radius: 8px; padding: 1rem; margin-top: .75rem; }
.link-box .label { font-size: .6rem; letter-spacing: .15em; color: var(--gold-dk); text-transform: uppercase; margin-bottom: .4rem; }
.link-box .url { font-size: .75rem; color: var(--gold-lt); word-break: break-all; margin-bottom: .5rem; cursor: pointer; }
.link-box .actions { display: flex; gap: .5rem; }
.link-box .actions button { flex: 1; padding: .4rem; border: 1px solid rgba(201,168,76,.2); background: transparent; color: var(--gold); border-radius: 4px; cursor: pointer; font-size: .7rem; }
.link-box .actions button:hover { background: rgba(201,168,76,.1); }

/* TABLE */
.table-wrap { background: var(--card); border: 1px solid rgba(201,168,76,.1); border-radius: 8px; overflow: hidden; }
.table-wrap table { width: 100%; border-collapse: collapse; }
.table-wrap th { background: var(--deep); padding: .6rem 1rem; text-align: left; font-size: .65rem; letter-spacing: .1em; color: var(--gold-dk); text-transform: uppercase; border-bottom: 1px solid rgba(201,168,76,.1); }
.table-wrap td { padding: .6rem 1rem; font-size: .8rem; border-bottom: 1px solid rgba(255,255,255,.03); vertical-align: middle; }
.table-wrap tr:last-child td { border-bottom: none; }
.table-wrap tr:hover td { background: rgba(255,255,255,.02); }
.badge { display: inline-block; padding: .2rem .5rem; border-radius: 4px; font-size: .65rem; font-weight: 600; }
.badge-pendente { background: rgba(201,168,76,.15); color: var(--gold); }
.badge-ativo { background: rgba(76,175,125,.15); color: var(--green); }
.badge-bloqueado { background: rgba(224,85,85,.15); color: var(--red); }
.badge-cancelado { background: rgba(100,100,100,.2); color: var(--muted); }
.table-actions { display: flex; gap: .4rem; }
.table-actions button { padding: .3rem .6rem; border-radius: 4px; border: none; cursor: pointer; font-size: .7rem; font-weight: 600; }
.btn-ativar { background: rgba(76,175,125,.2); color: var(--green); }
.btn-bloquear { background: rgba(224,85,85,.2); color: var(--red); }
.btn-link { background: rgba(201,168,76,.1); color: var(--gold); }
.btn-logs { background: rgba(100,100,100,.2); color: var(--muted); }
.sel-tema { margin-left: .5rem; background: var(--card); color: var(--cream); border: 1px solid rgba(201,168,76,.2); border-radius: 4px; padding: .15rem .3rem; font-size: .7rem; cursor: pointer; }
.sel-tema:disabled { opacity: .5; cursor: wait; }
.btn-excluir { background: rgba(224,85,85,.15); color: var(--red); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid rgba(201,168,76,.1); margin-bottom: 1.5rem; }
.tab { padding: .6rem 1.25rem; cursor: pointer; font-size: .8rem; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.logs-wrap { background: var(--deep); border-radius: 8px; padding: 1rem; font-family: monospace; font-size: .75rem; max-height: 400px; overflow-y: auto; }
.log-row { padding: .3rem 0; border-bottom: 1px solid rgba(255,255,255,.03); display: grid; grid-template-columns: 140px 80px 1fr 120px; gap: .5rem; }
.log-row:last-child { border-bottom: none; }
.log-ts { color: var(--muted); }
.log-ip { color: var(--muted); font-size: .7rem; }
.origem-nfc { color: var(--gold); }
.origem-qrcode { color: #7eb8e2; }
.origem-link_direto { color: var(--muted); }
.empty { text-align: center; padding: 3rem; color: var(--muted); font-size: .85rem; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--card); border: 1px solid rgba(201,168,76,.1); border-radius: 8px; padding: 1rem; text-align: center; }
.stat-num { font-size: 1.75rem; font-weight: 700; color: var(--gold); display: block; }
.stat-lbl { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2>⛏ Caverna Admin</h2>
    <input id="input-token" type="password" placeholder="Admin Token" />
    <button id="btn-login">Entrar</button>
    <div class="erro" id="login-erro"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <h1>⛏ Caverna · Admin</h1>
    <button class="sair" id="btn-sair">Sair</button>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div>
        <div class="section-title">Nova venda</div>
        <div class="form-group"><label>Nome do comprador</label><input id="f-nome" placeholder="João Silva"/></div>
        <div class="form-group"><label>Email</label><input id="f-email" type="email" placeholder="joao@email.com"/></div>
        <div class="form-group"><label>Telefone</label><input id="f-tel" placeholder="11999999999"/></div>
        <div class="form-group"><label>Método de pagamento</label><input id="f-metodo" value="pix"/></div>
        <div class="form-group"><label>Produto</label><select id="f-produto"></select></div>
        <div class="form-group"><label>Finalidade</label><select id="f-finalidade"><option value="venda">Venda</option><option value="marketing">Marketing / cortesia (sem cobrança)</option></select></div>
        <div class="form-group"><label>Valor pago (R$)</label><input id="f-valor" type="number" step="0.01" min="0"/></div>
        <button class="btn btn-primary" id="btn-venda" >♥ Registrar venda e gerar link</button>
        <div id="resultado-venda" style="display:none"></div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="section-title">Ações rápidas</div>
        <div style="display:flex;flex-direction:column;gap:.5rem">
          <button class="btn btn-secondary" id="btn-atualizar">↻ Atualizar lista</button>
          <button class="btn btn-danger" id="btn-limpar">🗑 Limpar dados de teste</button>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="tabs">
        <div class="tab active" id="tab-btn-chaveiros">Chaveiros</div>
        <div class="tab" id="tab-btn-logs">Logs de acesso</div>
      </div>

      <div id="tab-chaveiros">
        <div id="resumo-produtos" style="font-size:.75rem;color:var(--muted);margin-bottom:1rem"></div>
        <div class="stats" id="stats">
          <div class="stat-card"><span class="stat-num" id="s-total">-</span><span class="stat-lbl">Total</span></div>
          <div class="stat-card"><span class="stat-num" id="s-ativos">-</span><span class="stat-lbl">Ativos</span></div>
          <div class="stat-card"><span class="stat-num" id="s-pendentes">-</span><span class="stat-lbl">Pendentes</span></div>
          <div class="stat-card"><span class="stat-num" id="s-bloqueados">-</span><span class="stat-lbl">Bloqueados</span></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Código</th><th>Comprador</th><th>Produto</th><th>Status</th><th>Página</th><th>Criado em</th><th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-chaveiros">
              <tr><td colspan="6" class="empty">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="tab-logs" style="display:none">
        <div class="logs-wrap" id="logs-container">
          <div class="empty">Selecione um chaveiro para ver os logs</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = '' // mesmo domínio em que o painel está aberto
let TOKEN = ''

// ── LOGIN ──
async function fazerLogin() {
  const t = document.getElementById('input-token').value.trim()
  if (!t) return

  try {
    const res = await fetch(`${BASE}/admin/chaveiros`, {
      headers: { 'Authorization': `Bearer ${t}` }
    })
    if (res.status === 401) {
      document.getElementById('login-erro').textContent = 'Token inválido.'
      return
    }
    TOKEN = t
    sessionStorage.setItem('caverna-token', t)
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('app').style.display = 'block'
    carregarChaveiros()
  } catch {
    document.getElementById('login-erro').textContent = 'Erro de conexão.'
  }
}

function sair() {
  TOKEN = ''
  sessionStorage.removeItem('caverna-token')
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('app').style.display = 'none'
  document.getElementById('input-token').value = ''
}

// Tenta restaurar sessão
const saved = sessionStorage.getItem('caverna-token')
if (saved) {
  document.getElementById('input-token').value = saved
  fazerLogin()
}

// Enter no campo de token
document.getElementById('input-token').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin()
})

// ── API ──
async function api(method, path, body) {
  const res = await fetch(`${BASE}${path}`, {
    method,
    headers: {
      'Authorization': `Bearer ${TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || 'Erro na requisição')
  return data
}

// ── TOAST ──
function toast(msg, tipo = 'ok') {
  const el = document.createElement('div')
  el.className = `toast-item ${tipo}`
  el.textContent = msg
  document.getElementById('toast').appendChild(el)
  setTimeout(() => el.remove(), 3000)
}

// ── TABS ──
function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['chaveiros','logs'][i] === tab))
  document.getElementById('tab-chaveiros').style.display = tab === 'chaveiros' ? 'block' : 'none'
  document.getElementById('tab-logs').style.display = tab === 'logs' ? 'block' : 'none'
}

// ── CRIAR VENDA ──
async function criarVenda() {
  const nome = document.getElementById('f-nome').value.trim()
  const email = document.getElementById('f-email').value.trim()
  const tel = document.getElementById('f-tel').value.trim()
  const metodo = document.getElementById('f-metodo').value.trim()
  const valor = parseFloat(document.getElementById('f-valor').value)
  const produto = document.getElementById('f-produto').value
  const finalidade = document.getElementById('f-finalidade').value

  if (!nome || !email) return toast('Nome e email são obrigatórios', 'err')
  if (!produto) return toast('Escolha o produto', 'err')
  if (!(valor >= 0)) return toast('Informe o valor pago', 'err')

  const btn = document.getElementById('btn-venda')
  btn.disabled = true
  btn.textContent = 'Criando...'

  try {
    const chaveiro = await api('POST', '/admin/chaveiros', {})
    const pedido = await api('POST', `/admin/chaveiros/${chaveiro.id}/pedido`, {
      produto,
      finalidade,
      nome_comprador: nome,
      email_comprador: email,
      telefone: tel,
      metodo_pagamento: metodo,
      valor_pago: valor
    })

    const link = pedido.link_formulario
    const resultado = document.getElementById('resultado-venda')
    resultado.style.display = 'block'
    resultado.innerHTML = `
      <div class="link-box">
        <div class="label">Link do formulário — envie ao cliente</div>
        <div class="url" id="link-gerado">${link}</div>
        <div class="actions">
          <button id="btn-copiar-link">📋 Copiar</button>
          <button id="btn-abrir-link">🔗 Abrir</button>
          <button id="btn-whatsapp-link">💬 WhatsApp</button>
        </div>
      </div>
    `
    document.getElementById('btn-copiar-link').addEventListener('click', () => copiar(link))
    document.getElementById('btn-abrir-link').addEventListener('click', () => window.open(link, '_blank'))
    document.getElementById('btn-whatsapp-link').addEventListener('click', () => whatsapp(link, nome))

    toast(`Venda registrada para ${nome}!`, 'ok')
    carregarChaveiros()
    document.getElementById('f-nome').value = ''
    document.getElementById('f-email').value = ''
    document.getElementById('f-tel').value = ''
  } catch (err) {
    toast(err.message, 'err')
  } finally {
    btn.disabled = false
    btn.textContent = '♥ Registrar venda e gerar link'
  }
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

// ── PRODUTOS ──
let PRODUTOS = []
const nomeProduto = id => (PRODUTOS.find(p => p.id === id) || {}).nome || id || '—'
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })

let TEMAS = []

async function carregarProdutos() {
  if (PRODUTOS.length) return
  ;[PRODUTOS, TEMAS] = await Promise.all([api('GET', '/admin/produtos'), api('GET', '/admin/temas')])
  const sel = document.getElementById('f-produto')
  sel.innerHTML = '<option value="">Escolha…</option>' + PRODUTOS
    .map(p => `<option value="${p.id}">${p.nome}${p.preco ? ' — ' + brl(p.preco) : ''}</option>`).join('')
  const fin = document.getElementById('f-finalidade')
  const val = document.getElementById('f-valor')
  const aplicarValor = () => {
    const p = PRODUTOS.find(x => x.id === sel.value)
    const marketing = fin.value === 'marketing'
    val.disabled = marketing
    val.value = marketing ? '0.00' : (p && p.preco ? p.preco.toFixed(2) : '')
  }
  sel.addEventListener('change', aplicarValor)
  fin.addEventListener('change', aplicarValor)
}

function resumoPorProduto(lista) {
  const r = {}
  const marketing = lista.filter(c => c.finalidade === 'marketing').length
  // Só entra no faturamento o que foi pago (pedidos da loja nascem "aguardando pagamento")
  lista.filter(c => c.produto && c.finalidade !== 'marketing' && c.status_pagamento === 'pago').forEach(c => {
    r[c.produto] = r[c.produto] || { qtd: 0, total: 0 }
    r[c.produto].qtd++
    r[c.produto].total += Number(c.valor_pago || 0)
  })
  const partes = Object.entries(r).sort((a, b) => b[1].total - a[1].total)
    .map(([id, v]) => `${nomeProduto(id)}: <b style="color:var(--gold-lt)">${v.qtd}</b> · ${brl(v.total)}`)
  const txt = []
  if (partes.length) txt.push('Vendas por produto — ' + partes.join(' &nbsp;|&nbsp; '))
  if (marketing) txt.push(`Marketing: <b style="color:var(--gold-lt)">${marketing}</b> peça(s) de cortesia, fora do faturamento`)
  document.getElementById('resumo-produtos').innerHTML = txt.join('<br>')
}

// ── CARREGAR CHAVEIROS ──
async function carregarChaveiros() {
  try {
    await carregarProdutos()
    const lista = await api('GET', '/admin/chaveiros')
    resumoPorProduto(lista)
    document.getElementById('s-total').textContent = lista.length
    document.getElementById('s-ativos').textContent = lista.filter(c => c.status === 'ativo').length
    document.getElementById('s-pendentes').textContent = lista.filter(c => c.status === 'pendente').length
    document.getElementById('s-bloqueados').textContent = lista.filter(c => c.status === 'bloqueado').length

    const tbody = document.getElementById('tabela-chaveiros')
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Nenhum chaveiro cadastrado</td></tr>'
      return
    }

    tbody.innerHTML = ''
    lista.forEach(c => {
      const tr = document.createElement('tr')
      tr.innerHTML = `
        <td style="font-family:monospace;font-size:.7rem">${(c.codigo_unico || '').slice(0,12)}...</td>
        <td>${c.nome_comprador ? esc(c.nome_comprador) : '<span style="color:var(--muted)">—</span>'}</td>
        <td style="font-size:.75rem">${c.produto ? nomeProduto(c.produto) : '<span style="color:var(--muted)">—</span>'}${c.finalidade === 'marketing' ? ' <span style="color:var(--gold-dk)">· marketing</span>' : ''}${c.origem === 'loja' ? ' <span style="color:var(--muted)">· loja</span>' : ''}${c.status_pagamento === 'pendente' ? ' <span style="color:var(--red)">· aguardando pagamento</span>' : ''}${c.status_pagamento === 'estornado' ? ' <span style="color:var(--red)">· estornado</span>' : ''}</td>
        <td><span class="badge badge-${c.status}">${c.status}</span></td>
        <td>${c.slug_url
          ? `<a href="${BASE}/p/${c.slug_url}" target="_blank" style="color:var(--gold-lt);font-size:.75rem">abrir ↗</a>`
            + `<select class="sel-tema" data-id="${c.id}" aria-label="Cores da página">`
            + TEMAS.map(t => `<option value="${t.id}"${t.id === (c.tema || 'classico') ? ' selected' : ''}>${esc(t.nome)}</option>`).join('')
            + '</select>'
          : '<span style="color:var(--muted);font-size:.75rem">não criada</span>'
        }</td>
        <td style="font-size:.75rem;color:var(--muted)">${new Date(c.criado_em).toLocaleString('pt-BR')}</td>
        <td>
          <div class="table-actions">
            ${c.status !== 'ativo' ? `<button class="btn-ativar" data-id="${c.id}" data-action="ativar">Ativar</button>` : ''}
            ${c.status === 'ativo' ? `<button class="btn-bloquear" data-id="${c.id}" data-action="bloquear">Bloquear</button>` : ''}
            ${c.cep ? `<button class="btn-logs" data-id="${c.id}" data-action="entrega">Entrega</button>` : ''}
            <button class="btn-logs" data-id="${c.id}" data-action="logs">Logs</button>
            <button class="btn-excluir" data-id="${c.id}" data-action="excluir">🗑</button>
          </div>
        </td>
      `
      tbody.appendChild(tr)
      if (c.cep) {
        // Linha escondida com os dados de envio (textContent: nada do cliente vira HTML)
        const det = document.createElement('tr')
        det.id = `entrega-${c.id}`
        det.style.display = 'none'
        const td = document.createElement('td')
        td.colSpan = 7
        td.style.cssText = 'font-size:.78rem;white-space:pre-line;color:var(--cream)'
        td.textContent = [
          `${c.nome_comprador} · ${c.telefone || 'sem telefone'} · ${c.email_comprador}`,
          `${c.logradouro}, ${c.numero}${c.complemento ? ' — ' + c.complemento : ''}`,
          `${c.bairro} · ${c.cidade}/${c.uf} · CEP ${c.cep}`,
          `Frete: ${brl(c.frete)}`,
          c.observacoes ? `Gravar na peça: ${c.observacoes}` : ''
        ].filter(Boolean).join('\n')
        det.appendChild(td)
        tbody.appendChild(det)
      }
    })

    tbody.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id
        const action = btn.dataset.action
        if (action === 'entrega') {
          const det = document.getElementById(`entrega-${id}`)
          det.style.display = det.style.display === 'none' ? '' : 'none'
        }
        else if (action === 'ativar') mudarStatus(id, 'ativo')
        else if (action === 'bloquear') mudarStatus(id, 'bloqueado')
        else if (action === 'logs') verLogs(id)
        else if (action === 'excluir') excluirChaveiro(id)
      })
    })
    tbody.querySelectorAll('.sel-tema').forEach(sel => {
      sel.dataset.atual = sel.value
      sel.addEventListener('change', () => mudarTema(sel))
    })
  } catch (err) {
    toast(err.message, 'err')
  }
}

// Troca as cores de uma página pronta. Se der erro, o seletor volta ao tema anterior.
async function mudarTema(sel) {
  const anterior = sel.dataset.atual
  sel.disabled = true
  try {
    const r = await api('PATCH', `/admin/chaveiros/${sel.dataset.id}/tema`, { tema: sel.value })
    sel.dataset.atual = r.tema
    toast(`Tema trocado para ${TEMAS.find(t => t.id === r.tema)?.nome || r.tema}`, 'ok')
  } catch (err) {
    sel.value = anterior
    toast(err.message, 'err')
  } finally {
    sel.disabled = false
  }
}

async function mudarStatus(id, status) {
  try {
    await api('PATCH', `/admin/chaveiros/${id}/status`, { status })
    toast(`Status atualizado para ${status}`, 'ok')
    carregarChaveiros()
  } catch (err) {
    toast(err.message, 'err')
  }
}

async function verLogs(id) {
  showTab('logs')
  try {
    const logs = await api('GET', `/admin/chaveiros/${id}/logs`)
    const container = document.getElementById('logs-container')
    if (!logs.length) {
      container.innerHTML = '<div class="empty">Nenhum acesso registrado ainda</div>'
      return
    }
    container.innerHTML = logs.map(l => `
      <div class="log-row">
        <span class="log-ts">${new Date(l.acessado_em).toLocaleString('pt-BR')}</span>
        <span class="origem-${l.origem}">${l.origem}</span>
        <span>${(l.user_agent || '').slice(0,60) || '—'}</span>
        <span class="log-ip">${l.ip || '—'}</span>
      </div>
    `).join('')
  } catch (err) {
    toast(err.message, 'err')
  }
}

function copiar(texto) {
  navigator.clipboard.writeText(texto).then(() => toast('Link copiado!', 'ok'))
}

function whatsapp(link, nome) {
  const msg = encodeURIComponent(`Olá ${nome}! Acesse o link abaixo para montar sua memória:\n\n${link}`)
  window.open(`https://wa.me/?text=${msg}`, '_blank')
}

async function excluirChaveiro(id) {
  if (!confirm('Excluir este chaveiro e TODOS os dados associados (fotos, vídeos, página)? Não pode ser desfeito.')) return
  try {
    await api('DELETE', `/admin/chaveiros/${id}`)
    toast('Chaveiro excluído com sucesso!', 'ok')
    carregarChaveiros()
  } catch (err) {
    toast(err.message, 'err')
  }
}

function confirmarLimpeza() {
  if (!confirm('Apagar TODOS os dados de teste? Essa ação não pode ser desfeita.')) return
  api('POST', '/admin/lgpd/anonimizar', {})
    .then(() => { toast('Dados limpos!', 'ok'); carregarChaveiros() })
    .catch(err => toast(err.message, 'err'))
}

// ── EVENT LISTENERS (CSP safe) ──
document.getElementById('btn-login').addEventListener('click', fazerLogin)
document.getElementById('btn-sair').addEventListener('click', sair)
document.getElementById('btn-venda').addEventListener('click', criarVenda)
document.getElementById('btn-atualizar').addEventListener('click', carregarChaveiros)
document.getElementById('btn-limpar').addEventListener('click', confirmarLimpeza)
document.getElementById('tab-btn-chaveiros').addEventListener('click', () => showTab('chaveiros'))
document.getElementById('tab-btn-logs').addEventListener('click', () => showTab('logs'))

</script>
