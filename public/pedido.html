<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Seu pedido — A Caverna</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--black:#0a0806;--card:#1a1410;--wine:#6b1a2a;--wine-lt:#8b2a3f;--gold:#c9a84c;--gold-lt:#e2c97e;--gold-dk:#8a6b28;--cream:#f0e6d3;--muted:#9a8a78;--text:#e8ddd0;--line:rgba(201,168,76,.16)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;line-height:1.6;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
main{width:100%;max-width:460px;text-align:center}
.eyebrow{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.3em;color:var(--gold-dk);text-transform:uppercase}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;color:var(--cream);font-size:2.1rem;line-height:1.15;margin:1rem 0 .75rem}
h1 em{font-style:italic;color:var(--gold-lt)}
p{color:var(--muted);font-size:.92rem;margin-bottom:1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.4rem;margin-bottom:1.5rem;font-size:.9rem;text-align:left}
.card div{display:flex;justify-content:space-between;gap:1rem;padding:.15rem 0}
.card .total{color:var(--cream);font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;width:100%;padding:.85rem 1.5rem;border-radius:6px;border:none;background:var(--wine);color:var(--cream);
  font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--wine-lt)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nota{font-size:.75rem;margin-top:1rem}
.ring{width:38px;height:38px;border:2px solid var(--gold-dk);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<main>
  <span class="eyebrow">A Caverna · Memórias</span>

  <div id="carregando"><div class="ring" style="margin-top:2rem"></div></div>

  <div id="conteudo" hidden>
    <h1 id="titulo"></h1>
    <p id="texto" aria-live="polite"></p>
    <div class="card">
      <div><span id="produto"></span></div>
      <div class="total"><span>Total</span><span id="total"></span></div>
    </div>
    <a class="btn" id="acao" hidden></a>
    <p class="nota" id="nota"></p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id)
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
const token = location.pathname.split('/').pop()
let timer

function mostrar(d) {
  $('carregando').hidden = true
  $('conteudo').hidden = false
  $('produto').textContent = d.produto
  $('total').textContent = brl(d.total)
  const acao = $('acao')

  if (d.status === 'pago' && d.proximo?.tipo === 'pagina') {
    $('titulo').innerHTML = 'Sua memória <em>está pronta</em>'
    $('texto').textContent = 'A página já foi criada. A peça está em produção e segue para o endereço informado.'
    acao.textContent = 'Abrir minha página'; acao.href = d.proximo.url; acao.target = '_self'; acao.hidden = false
    $('nota').textContent = ''
  } else if (d.status === 'pago') {
    $('titulo').innerHTML = 'Pagamento <em>confirmado</em>'
    $('texto').textContent = `Obrigado, ${d.nome}. Agora falta a melhor parte: enviar as fotos e contar a história.`
    acao.textContent = 'Montar minha memória'; acao.href = d.proximo.url; acao.target = '_self'; acao.hidden = false
    $('nota').textContent = 'Guarde o endereço desta página: por ele você volta quando quiser.'
  } else if (d.status === 'estornado') {
    $('titulo').innerHTML = 'Pagamento <em>estornado</em>'
    $('texto').textContent = 'O valor deste pedido foi devolvido. Se foi um engano, fale com a gente.'
    acao.hidden = true; $('nota').textContent = ''
  } else {
    $('titulo').innerHTML = 'Falta só o <em>pagamento</em>'
    $('texto').textContent = `${d.nome}, seu pedido está reservado. Pague por PIX, cartão ou boleto na página segura do Asaas.`
    acao.textContent = 'Pagar agora'; acao.href = d.pagamento; acao.target = '_blank'; acao.rel = 'noopener'; acao.hidden = !d.pagamento
    $('nota').textContent = 'Esta página atualiza sozinha assim que o pagamento for confirmado.'
  }
  return d.status
}

async function consultar() {
  try {
    const res = await fetch(`/api/pedido/${encodeURIComponent(token)}`)
    if (res.status === 404) {
      $('carregando').hidden = true; $('conteudo').hidden = false
      $('titulo').textContent = 'Pedido não encontrado'
      $('texto').textContent = 'Confira o endereço ou faça um novo pedido.'
      document.querySelector('.card').hidden = true
      return
    }
    if (!res.ok) throw new Error()
    const status = mostrar(await res.json())
    if (status === 'pendente') timer = setTimeout(consultar, 6000)
  } catch {
    timer = setTimeout(consultar, 10000)
  }
}

// Ao voltar da página de pagamento, confere na hora
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { clearTimeout(timer); consultar() }
})
consultar()
</script>
</body>
</html>
